app-id: com.realvnc.viewer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: vncviewer
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --persist=.vnc
modules:
  - name: vncviewer
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://web.archive.org/web/20251228062031/https://downloads.realvnc.com/download/file/viewer.files/VNC-Viewer-7.15.1-Linux-x64.deb
        sha256: 05e3c75e053507492f7b9a3f2d75925ac6b5dc9249af73ae6c1ac51bc5d6aabb
        dest-filename: vnc-viewer.deb
      - type: file
        only-arches:
          - aarch64
        url: https://web.archive.org/web/20251228062031/https://downloads.realvnc.com/download/file/viewer.files/VNC-Viewer-7.15.1-Linux-ARM64.deb
        sha256: ff746082e9defb3e3350bf16f17bb6232fc68b944a67575ea03382b779ea7061
        dest-filename: vnc-viewer.deb
      - type: file
        path: com.realvnc.viewer.metainfo.xml
    buildsystem: simple
    build-commands:
      - ar vx vnc-viewer.deb
      - tar xvf data.tar.xz
      - install -Dm755 usr/bin/vncviewer /app/bin/vncviewer
    post-install:
      - install -Dm644 usr/share/icons/hicolor/48x48/apps/vncviewer48x48.png ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/${FLATPAK_ID}.svg
      - sed -e "s|Icon=/usr/share/icons/hicolor/48x48/apps/vncviewer48x48.png|Icon=${FLATPAK_ID}|g" usr/share/applications/realvnc-vncviewer.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
